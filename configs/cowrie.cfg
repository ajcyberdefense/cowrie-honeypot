# =============================================================================
# cowrie.cfg — Cowrie Honeypot Configuration
# =============================================================================
# Place this file at: /home/cowrie/cowrie/etc/cowrie.cfg
#
# This is a minimal hardened config. For full options see:
# https://github.com/cowrie/cowrie/blob/master/etc/cowrie.cfg.dist
# =============================================================================

[honeypot]

# Hostname the attacker sees after logging in
hostname = svr04

# Directory for storing downloaded malware samples
download_path = ${honeypot:state_path}/downloads

# Fake filesystem template
filesystem = ${honeypot:share_path}/fs.pickle

# Contents of /etc/passwd shown to attackers
etc_passwd = ${honeypot:share_path}/cowrie/data/userdb.txt

# Session IDs for log correlation
session_id = ""

# Fake OS type shown to attackers
kernel_version = 5.4.0-135-generic
kernel_build_string = #152-Ubuntu SMP Wed Nov 23 20:19:22 UTC 2022
hardware_platform = x86_64
operating_system = GNU/Linux

# How long (seconds) before idle sessions are disconnected
interactive_timeout = 180

# Max number of files that can be downloaded per session
download_limit_size = 10485760

# Fake hostname for SFTP
arch = linux-x86_64


# =============================================================================
# SSH Configuration
# =============================================================================
[ssh]

# Port Cowrie listens on for fake SSH connections
listen_endpoints = tcp:2222:interface=0.0.0.0

# Fake SSH version string shown to scanners
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5

# Enable/disable
enabled = true

# RSA host key (auto-generated on first run)
# rsa_public_key = etc/ssh_host_rsa_key.pub


# =============================================================================
# Telnet Configuration
# =============================================================================
[telnet]

# Enable fake Telnet listener
enabled = true

# Port for fake Telnet
listen_endpoints = tcp:23:interface=0.0.0.0


# =============================================================================
# Logging
# =============================================================================
[output_jsonlog]

# JSON log file — used for analysis scripts
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false


[output_textlog]

# Human-readable log file
enabled = true
logfile = ${honeypot:log_path}/cowrie.log


# =============================================================================
# Credentials — fake usernames/passwords Cowrie accepts
# =============================================================================
# Edit /home/cowrie/cowrie/etc/userdb.txt to control which creds "work"
# Default: root/123456, admin/admin, etc. (common attacker defaults)
