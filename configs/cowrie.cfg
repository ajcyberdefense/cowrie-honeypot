# =============================================================================
# cowrie.cfg — Cowrie Honeypot Configuration (overrides only)
# =============================================================================
# Install to: /home/cowrie/honeypot/etc/cowrie.cfg
#
# Cowrie 3.x loads configuration in layers:
#   1. Bundled defaults (cowrie.cfg.dist inside the installed package)
#   2. /etc/cowrie/cowrie.cfg      (system-wide, if present)
#   3. ./etc/cowrie.cfg            (this file — per state directory)
#   4. ./cowrie.cfg                (alternate flat layout)
#
# Later layers win. So this file only needs the keys we actually change —
# everything omitted falls through to the bundled defaults. Run `cowrie init`
# to materialize the full cowrie.cfg.dist reference alongside this file.
# =============================================================================


[honeypot]

# Hostname the attacker sees at the fake shell prompt
hostname = svr04

# Disconnect idle attacker sessions after 3 minutes
idle_timeout = 180

# Record full TTY sessions (replay later with: playlog var/lib/cowrie/tty/<file>)
ttylog = true

# Cap each stored malware sample at 10 MB.
# NOTE: Cowrie's wget/curl emulation really does fetch the file in order to
# capture the sample — the attacker's command is faked, the download is not.
# This caps what gets written to disk; it does not stop the outbound request.
download_limit_size = 10485760


# =============================================================================
# Fake system profile
# =============================================================================
# These live in [shell], NOT [honeypot]. Values here are what the attacker
# sees from `uname -a`, /proc/version, /proc/cpuinfo and friends.
[shell]

arch = linux-x64-lsb
kernel_version = 5.15.0-119-generic
kernel_build_string = #129-Ubuntu SMP Fri Aug 2 19:25:50 UTC 2024
hardware_platform = x86_64
operating_system = GNU/Linux


# =============================================================================
# SSH honeypot listener
# =============================================================================
[ssh]

enabled = true

# Cowrie listens high; the host redirects :22 -> :2222 via iptables so we
# catch the scan traffic that actually matters. See docs/02-hardening.md.
listen_endpoints = tcp:2222:interface=0.0.0.0

# Banner shown to scanners. Keep this consistent with the [shell] kernel
# version above — mismatched banners are a common honeypot tell.
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.10


# =============================================================================
# Telnet honeypot listener
# =============================================================================
[telnet]

enabled = true

# IMPORTANT: Cowrie's *default* telnet port is 2223, which collides with this
# host's real admin SSH port (also 2223). Bind 2323 instead and redirect
# :23 -> :2323. Leaving this unset would silently fight sshd for the port.
listen_endpoints = tcp:2323:interface=0.0.0.0


# =============================================================================
# Logging
# =============================================================================
# JSON log — this is what scripts/analyze.py and scripts/dashboard.py parse.
[output_jsonlog]

enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false


# -----------------------------------------------------------------------------
# Note on the other log file:
#   var/log/cowrie/cowrie.log is Twisted's own runtime log and is always
#   written — that is the one to `tail -f` when debugging startup.
#   [output_textlog] is a separate, off-by-default plugin writing audit.log.
#   Leave it off; the JSON log is strictly more useful.
# -----------------------------------------------------------------------------


# =============================================================================
# Fake credentials
# =============================================================================
# Which username/password pairs "work" is controlled by etc/userdb.txt.
# `cowrie init` writes userdb.example — copy it to userdb.txt to customize.
# The shipped default accepts most common bot guesses (root/123456, etc.),
# which is what you want: a login that always fails records no session.
