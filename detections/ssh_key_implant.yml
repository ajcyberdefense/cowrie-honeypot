title: SSH Key Written to authorized_keys With Attribute Tampering
id: 88d5043f-923e-5890-b1d3-b39f4476e57a
status: experimental
description: 'Replaces authorized_keys with the attacker''s key and uses chattr to strip (then often re-add) the immutable flag so the owner cannot remove it. Includes the long-running ''mdrfckr'' campaign.'
author: cowrie-honeypot
date: 2026/08/11
tags:
    - attack.persistence
    - attack.t1098.004
    - attack.defense_evasion
    - attack.t1222.002
logsource:
    product: cowrie
    service: cowrie
detection:
    selection:
        eventid: cowrie.command.input
        input|re: '(?i)ssh-(rsa|ed25519|dss)\s+\S+.*>>?\s*\S*authorized_keys|chattr\s+-ia\s+\S*\.ssh|\block(r)?\s+-ia\s+\S*\.ssh'
    condition: selection
fields:
    - src_ip
    - session
    - input
falsepositives:
    - 'An admin appending their own key with echo >> authorized_keys will match the first branch. The chattr -ia branch alone is rare and a stronger signal; split the rule if the echo branch is noisy'
level: high
