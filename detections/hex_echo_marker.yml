title: Hex-Escaped echo Used as a Shell Liveness Marker
id: 029ecf41-06ce-5d8f-940a-f48a29af1b2f
status: experimental
description: 'Bots echo a hex-escaped string and check that the decoded text comes back, proving a real shell that interprets escapes. Encoding keeps the marker out of naive string matches (\x47\x41\x59\x46\x47\x54 = GAYFGT, the Gafgyt tag).'
author: cowrie-honeypot
date: 2026/08/11
tags:
    - attack.discovery
    - attack.t1082
    - attack.defense_evasion
    - attack.t1027
logsource:
    product: cowrie
    service: cowrie
detection:
    selection:
        eventid: cowrie.command.input
        input|re: '(?i)echo\s+-e\s+[''\"]?(\x5cx[0-9a-f]{2}){4,}'
    condition: selection
fields:
    - src_ip
    - session
    - input
falsepositives:
    - 'Scripts printing binary bytes or byte-exact test data with echo -e. ANSI color codes do not match: they are single \x1b escapes, not runs of four or more'
level: high
