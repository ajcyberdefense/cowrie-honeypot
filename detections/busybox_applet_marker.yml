title: BusyBox Called With an Uppercase Nonexistent Applet
id: 0e5747b0-6c68-5eea-9e8e-8becba4d741c
status: experimental
description: 'Mirai-family loaders run `/bin/busybox <TAG>` and look for ''<TAG>: applet not found'' to confirm a real BusyBox shell. The tag doubles as the botnet''s name (BOTNET, HISILICON, ECCHI, LZRD, UNSTABLE).'
author: cowrie-honeypot
date: 2026/08/11
tags:
    - attack.discovery
    - attack.t1082
logsource:
    product: cowrie
    service: cowrie
detection:
    selection:
        eventid: cowrie.command.input
        input|re: '/bin/busybox\s+[A-Z]{4,}\b'
    condition: selection
fields:
    - src_ip
    - session
    - input
falsepositives:
    - 'None expected — BusyBox applets are lowercase and no admin types an uppercase one on purpose'
level: high
