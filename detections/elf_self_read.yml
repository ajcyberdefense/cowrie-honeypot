title: Reading a Binary's Own Bytes to Learn the CPU Architecture
id: dd631456-9fc5-5665-b527-4f57426dcb6e
status: experimental
description: 'Dumps an ELF binary to the terminal so the loader can parse its header and pick the matching payload (arm, mips, x86). Used instead of `uname -m`, which can be faked.'
author: cowrie-honeypot
date: 2026/08/11
tags:
    - attack.discovery
    - attack.t1082
logsource:
    product: cowrie
    service: cowrie
detection:
    selection:
        eventid: cowrie.command.input
        input|re: 'cat\s+/proc/self/exe|busybox\s+cat\s+/bin/(echo|busybox)\b|done\s*<\s*/bin/busybox'
    condition: selection
fields:
    - src_ip
    - session
    - input
falsepositives:
    - 'Nobody cats a binary to a terminal on purpose; a mistyped `cat /bin/...` is the only realistic benign case'
level: high
