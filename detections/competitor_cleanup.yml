title: Killing Rival Malware and Wiping hosts.deny
id: d275b234-1e51-5002-8233-74fac3d38f47
status: experimental
description: 'Empties hosts.deny (undoing brute-force lockouts) and kills scripts left by competing botnets so this one owns the box.'
author: cowrie-honeypot
date: 2026/09/18
tags:
    - attack.defense_evasion
    - attack.t1562.001
    - attack.impact
    - attack.t1489
logsource:
    product: cowrie
    service: cowrie
detection:
    selection:
        eventid: cowrie.command.input
        input|re: 'echo\s*>\s*/etc/hosts\.deny|pkill\s+-9\s+(secure|auth)\.sh'
    condition: selection
fields:
    - src_ip
    - session
    - input
falsepositives:
