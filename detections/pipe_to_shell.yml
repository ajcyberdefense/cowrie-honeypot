title: Remote Script Piped Straight Into a Shell
id: a3d1caac-13a7-5b15-855f-cee88c2c0c71
status: experimental
description: 'Executes a remote script without it ever touching disk as a file, which defeats file-based scanning.'
author: cowrie-honeypot
date: 2026/08/11
tags:
    - attack.command_and_control
    - attack.t1105
    - attack.execution
    - attack.t1059.004
logsource:
    product: cowrie
    service: cowrie
detection:
    selection:
        eventid: cowrie.command.input
        input|re: '(?i)\b(curl|wget)\b[^|;&]*\|\s*(ba)?sh\b|\b(ba)?sh\s+<\(\s*(curl|wget)\b'
    condition: selection
fields:
    - src_ip
    - session
    - input
falsepositives:
    - 'Vendor install instructions (rustup, Homebrew, Docker convenience script, nvm). An admin really does type these — tune with an allowlist of known installer domains rather than dropping the rule'
level: medium
